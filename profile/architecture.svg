<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117" rx="8"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#21262d" stroke-width="0.3" opacity="0.4">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
  </g>

  <!-- ===== CONNECTION LINES WITH ANIMATED DASHES ===== -->

  <!-- Cortex Prime to COO -->
  <line x1="300" y1="55" x2="300" y2="95" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6,4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- COO to Masters -->
  <g stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6">
    <line x1="190" y1="135" x2="80" y2="190">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="240" y1="135" x2="190" y2="190">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="135" x2="300" y2="190">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="360" y1="135" x2="410" y2="190">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="410" y1="135" x2="520" y2="190">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Masters to Workers -->
  <g stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3" opacity="0.5">
    <line x1="80" y1="230" x2="80" y2="275">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="190" y1="230" x2="190" y2="275">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="230" x2="300" y2="275">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="410" y1="230" x2="410" y2="275">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="520" y1="230" x2="520" y2="275">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Infrastructure connections -->
  <g stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5">
    <!-- COO to GitHub API -->
    <line x1="420" y1="115" x2="620" y2="80">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <!-- CI/CD Master to Actions -->
    <line x1="560" y1="210" x2="620" y2="160">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <!-- Workers to K3s -->
    <line x1="520" y1="305" x2="620" y2="240">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== CORTEX PRIME ===== -->
  <g filter="url(#glowStrong)">
    <rect x="200" y="20" width="200" height="35" rx="10" fill="#58a6ff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="300" y="44" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14" font-weight="700" fill="#ffffff">Cortex Prime</text>

  <!-- ===== COO ORCHESTRATOR ===== -->
  <g filter="url(#glow)">
    <rect x="195" y="95" width="210" height="40" rx="8" fill="#58a6ff" opacity="0.8"/>
  </g>
  <text x="300" y="120" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="12" font-weight="600" fill="#ffffff">COO Orchestrator</text>

  <!-- ===== MASTER AGENTS ===== -->
  <!-- Coordinator -->
  <rect x="30" y="190" width="100" height="40" rx="8" fill="#3fb950" opacity="0.85"/>
  <text x="80" y="215" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" font-weight="600" fill="#ffffff">Coordinator</text>

  <!-- Development -->
  <rect x="140" y="190" width="100" height="40" rx="8" fill="#3fb950" opacity="0.85"/>
  <text x="190" y="215" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" font-weight="600" fill="#ffffff">Development</text>

  <!-- Security -->
  <rect x="250" y="190" width="100" height="40" rx="8" fill="#3fb950" opacity="0.85"/>
  <text x="300" y="215" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" font-weight="600" fill="#ffffff">Security</text>

  <!-- Inventory -->
  <rect x="360" y="190" width="100" height="40" rx="8" fill="#3fb950" opacity="0.85"/>
  <text x="410" y="215" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" font-weight="600" fill="#ffffff">Inventory</text>

  <!-- CI/CD -->
  <rect x="470" y="190" width="100" height="40" rx="8" fill="#3fb950" opacity="0.85"/>
  <text x="520" y="215" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" font-weight="600" fill="#ffffff">CI/CD</text>

  <!-- ===== WORKERS ===== -->
  <g opacity="0.7">
    <rect x="40" y="275" width="80" height="30" rx="6" fill="#238636"/>
    <text x="80" y="295" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="9" fill="#e6edf3">Workers</text>

    <rect x="150" y="275" width="80" height="30" rx="6" fill="#238636"/>
    <text x="190" y="295" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="9" fill="#e6edf3">Workers</text>

    <rect x="260" y="275" width="80" height="30" rx="6" fill="#238636"/>
    <text x="300" y="295" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="9" fill="#e6edf3">Workers</text>

    <rect x="370" y="275" width="80" height="30" rx="6" fill="#238636"/>
    <text x="410" y="295" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="9" fill="#e6edf3">Workers</text>

    <rect x="480" y="275" width="80" height="30" rx="6" fill="#238636"/>
    <text x="520" y="295" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="9" fill="#e6edf3">Workers</text>
  </g>

  <!-- ===== INFRASTRUCTURE STACK (right side) ===== -->
  <g filter="url(#glow)">
    <rect x="620" y="60" width="150" height="35" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="695" y="83" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" font-weight="600" fill="#58a6ff">GitHub API</text>

    <rect x="620" y="140" width="150" height="35" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="695" y="163" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" font-weight="600" fill="#58a6ff">Actions</text>

    <rect x="620" y="220" width="150" height="35" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="695" y="243" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" font-weight="600" fill="#58a6ff">K3s</text>
  </g>

  <!-- Infrastructure vertical connections -->
  <line x1="695" y1="95" x2="695" y2="140" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="695" y1="175" x2="695" y2="220" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Labels -->
  <text x="300" y="345" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" fill="#484f58">Agent Hierarchy</text>
  <text x="695" y="285" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="10" fill="#484f58">Infrastructure</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="799" height="399" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>