hor="middle" class="mono" font-size="10.5" fill="#7ee787">Fix</text>  <rect class="master" style="animation-delay:1.2s" x="284" y="190" width="118" height="40" rx="9" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/><text x="343" y="215" text-anchor="middle" class="sans b" font-size="14" fill="#e6edf3">Security</text>  <line x1="343" y1="230" x2="343" y2="284" stroke="#238636" stroke-dasharray="2 4"/>  <rect x="291" y="246" width="104" height="22" rx="11" fill="#0d1117" stroke="#238636"/><text x="343" y="261" text-anchor="middle" class="mono" font-size="10.5" fill="#7ee787">Scan</text>  <rect x="291" y="274" width="104" height="22" rx="11" fill="#0d1117" stroke="#238636"/><text x="343" y="289" text-anchor="middle" class="mono" font-size="10.5" fill="#7ee787">Security Fix</text>  <rect class="master" style="animation-delay:1.8s" x="414" y="190" width="118" height="40" rx="9" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/><text x="473" y="215" text-anchor="middle" class="sans b" font-size="14" fill="#e6edf3">Inventory</text>  <line x1="473" y1="230" x2="473" y2="256" stroke="#238636" stroke-dasharray="2 4"/>  <rect x="421" y="246" width="104" height="22" rx="11" fill="#0d1117" stroke="#238636"/><text x="473" y="261" text-anchor="middle" class="mono" font-size="10.5" fill="#7ee787">Analysis</text>  <rect class="master" style="animation-delay:2.4s" x="544" y="190" width="118" height="40" rx="9" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/><text x="603" y="215" text-anchor="middle" class="sans b" font-size="14" fill="#e6edf3">CI/CD</text>  <line x1="603" y1="230" x2="603" y2="284" stroke="#238636" stroke-dasharray="2 4"/>  <rect x="551" y="246" width="104" height="22" rx="11" fill="#0d1117" stroke="#238636"/><text x="603" y="261" text-anchor="middle" class="mono" font-size="10.5" fill="#7ee787">Implementation</text>  <rect x="551" y="274" width="104" height="22" rx="11" fill="#0d1117" stroke="#238636"/><text x="603" y="289" text-anchor="middle" class="mono" font-size="10.5" fill="#7ee787">Test</text>  <rect x="690" y="40" width="186" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="783" y="65" text-anchor="middle" class="sans b" font-size="14" fill="#9ecbff">GitHub API</text>  <rect x="690" y="100" width="186" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="783" y="125" text-anchor="middle" class="sans b" font-size="14" fill="#9ecbff">Actions</text>  <rect x="690" y="160" width="186" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="783" y="185" text-anchor="middle" class="sans b" font-size="14" fill="#9ecbff">K3s · ArgoCD</text>  <text x="783" y="226" text-anchor="middle" class="mono" font-size="11" fill="#6e7681">infrastructure</text>  <rect x="24" y="338" width="852" height="38" rx="9" fill="#161b22" stroke="#30363d"/><text x="44" y="362" class="mono" font-size="12" fill="#8b949e"><tspan fill="#a371f7" font-weight="700">9 daemons</tspan>  self-healing · monitoring · token-budget enforcement · coordination persistence</text>
