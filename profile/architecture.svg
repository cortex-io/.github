<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
  <title id="t">Cortex architecture</title>
  <desc id="d">Cortex Prime directs a COO Orchestrator, which routes work to five master agents: Coordinator (Analysis, Documentation), Development (Implementation, Test, Fix), Security (Scan, Security Fix), Inventory (Analysis), CI/CD (Implementation, Test). The orchestrator drives the GitHub API, Actions, and K3s via ArgoCD. Nine daemons handle self-healing, monitoring, token-budget enforcement and coordination persistence.</desc>
  <defs><path id="m0" d="M343 140C343 168 83 160 83 190"/><path id="m1" d="M343 140C343 168 213 160 213 190"/><path id="m2" d="M343 140C343 168 343 160 343 190"/><path id="m3" d="M343 140C343 168 473 160 473 190"/><path id="m4" d="M343 140C343 168 603 160 603 190"/><path id="pc" d="M343 72V100"/><path id="i0" d="M454 120C560 120 600 60 690 60"/><path id="i1" d="M454 120C560 120 600 120 690 120"/><path id="i2" d="M454 120C560 120 600 180 690 180"/></defs>
  <style>
    .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .b{font-weight:600}
    .pipe{fill:none;stroke:#21262d;stroke-width:5;stroke-linecap:round}
    .flow{fill:none;stroke:#58a6ff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:3 9;animation:flow 1.2s linear infinite}
    .dim{stroke:#484f58}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .master{animation:glow 3s ease-in-out infinite}
    @keyframes glow{0%,100%{stroke-opacity:.45}20%{stroke-opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
  </style>
  <rect x="1" y="1" width="898" height="398" rx="16" fill="#0d1117" stroke="#30363d"/>
  <use href="#m0" class="pipe"/><use href="#m0" class="flow"/><use href="#m1" class="pipe"/><use href="#m1" class="flow"/><use href="#m2" class="pipe"/><use href="#m2" class="flow"/><use href="#m3" class="pipe"/><use href="#m3" class="flow"/><use href="#m4" class="pipe"/><use href="#m4" class="flow"/><use href="#pc" class="pipe"/><use href="#pc" class="flow"/><use href="#i0" class="pipe"/><use href="#i0" class="flow dim"/><use href="#i1" class="pipe"/><use href="#i1" class="flow dim"/><use href="#i2" class="pipe"/><use href="#i2" class="flow dim"/>
  <g class="pkt"><circle r="3.5" fill="#58a6ff"><animateMotion dur="3s" begin="-0.0s" repeatCount="indefinite"><mpath href="#m0"/></animateMotion></circle><circle r="3.5" fill="#58a6ff"><animateMotion dur="3s" begin="-0.6s" repeatCount="indefinite"><mpath href="#m1"/></animateMotion></circle><circle r="3.5" fill="#58a6ff"><animateMotion dur="3s" begin="-1.2s" repeatCount="indefinite"><mpath href="#m2"/></animateMotion></circle><circle r="3.5" fill="#58a6ff"><animateMotion dur="3s" begin="-1.8s" repeatCount="indefinite"><mpath href="#m3"/></animateMotion></circle><circle r="3.5" fill="#58a6ff"><animateMotion dur="3s" begin="-2.4s" repeatCount="indefinite"><mpath href="#m4"/></animateMotion></circle><circle r="3.5" fill="#a371f7"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#pc"/></animateMotion></circle></g>
  
