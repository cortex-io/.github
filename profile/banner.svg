<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="180" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#21262d" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="30" x2="900" y2="30"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="90" x2="900" y2="90"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="100" y1="0" x2="100" y2="180"/>
    <line x1="200" y1="0" x2="200" y2="180"/>
    <line x1="300" y1="0" x2="300" y2="180"/>
    <line x1="400" y1="0" x2="400" y2="180"/>
    <line x1="500" y1="0" x2="500" y2="180"/>
    <line x1="600" y1="0" x2="600" y2="180"/>
    <line x1="700" y1="0" x2="700" y2="180"/>
    <line x1="800" y1="0" x2="800" y2="180"/>
  </g>

  <!-- Animated pulse line -->
  <line x1="0" y1="90" x2="900" y2="90" stroke="#58a6ff" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite"/>
  </line>
  <rect x="-100" y="0" width="100" height="180" fill="none">
    <animate attributeName="x" values="-100;900" dur="4s" repeatCount="indefinite"/>
  </rect>
  <line x1="0" y1="0" x2="0" y2="180" stroke="#58a6ff" stroke-width="2" opacity="0.15">
    <animate attributeName="x1" values="-10;910" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-10;910" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Title -->
  <text x="450" y="72" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="48" font-weight="700" fill="#e6edf3" filter="url(#textGlow)">Cortex</text>

  <!-- Tagline -->
  <text x="450" y="105" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="16" fill="#8b949e">Autonomous DevOps Platform</text>

  <!-- ARCHIVED badge -->
  <rect x="780" y="12" width="100" height="26" rx="6" fill="none" stroke="#f0883e" stroke-width="1.5"/>
  <text x="830" y="30" text-anchor="middle" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="12" font-weight="600" fill="#f0883e">ARCHIVED</text>

  <!-- Feature pills -->
  <g transform="translate(450, 145)" text-anchor="middle">
    <!-- Multi-Agent -->
    <rect x="-285" y="-12" width="110" height="24" rx="12" fill="#238636" opacity="0.9"/>
    <text x="-230" y="5" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" fill="#e6edf3" text-anchor="middle">Multi-Agent</text>

    <!-- K3s -->
    <rect x="-155" y="-12" width="70" height="24" rx="12" fill="#1f6feb" opacity="0.9"/>
    <text x="-120" y="5" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" fill="#e6edf3" text-anchor="middle">K3s</text>

    <!-- ArgoCD -->
    <rect x="-65" y="-12" width="90" height="24" rx="12" fill="#6e40c9" opacity="0.9"/>
    <text x="-20" y="5" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" fill="#e6edf3" text-anchor="middle">ArgoCD</text>

    <!-- Self-Healing -->
    <rect x="45" y="-12" width="120" height="24" rx="12" fill="#b08800" opacity="0.9"/>
    <text x="105" y="5" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" fill="#e6edf3" text-anchor="middle">Self-Healing</text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="179" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>